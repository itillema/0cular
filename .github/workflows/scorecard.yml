# OpenSSF Scorecard. Publishing results restricts this workflow's shape: no
# top-level env, defaults or write permissions, and only the allowed actions in
# the analysis job. See https://github.com/ossf/scorecard-action#workflow-restrictions.
name: scorecard

on:
  branch_protection_rule:
  # Run on demand, for example after changing repository settings.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Scorecard reads workflow runs for its CI and SAST checks.
      contents: read
      security-events: write # Upload the results to code scanning.
      id-token: write # Publish the results, which the badge and the Scorecard API read.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
