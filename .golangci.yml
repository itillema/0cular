version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nolintlint
    - revive
  settings:
    depguard:
      rules:
        # eval and the loader run inside applications, so they reach stores
        # only through the read-only store.Source interface, never an SDK.
        # So does the CEL environment they embed.
        no-store-sdks:
          files:
            - "**/eval/**"
            - "**/loader/**"
            - "**/internal/celenv/**"
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: eval and the loader reach stores only through store.Source
            - pkg: github.com/hashicorp/consul/api
              desc: eval and the loader reach stores only through store.Source
            - pkg: go.etcd.io/etcd
              desc: eval and the loader reach stores only through store.Source
            - pkg: github.com/Azure/azure-sdk-for-go
              desc: eval and the loader reach stores only through store.Source
            - pkg: cloud.google.com/go/storage
              desc: eval and the loader reach stores only through store.Source
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: library code must not panic; return an error instead
        - pattern: ^os\.Exit$
          msg: only a command's main function exits; return an error or an exit code instead
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: write to an injected io.Writer instead of standard output
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    # The "comments" preset is deliberately absent: missing doc comments are reported.
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests may panic, exit from TestMain and print.
      - path: _test\.go$
        linters:
          - forbidigo
      # A command's main function is where the process exits.
      - path: (^|/)cmd/[^/]+/main\.go$
        text: os\.Exit
        linters:
          - forbidigo
      # Replay consumer stubs are small commands that exit with a status and
      # read the file named on their command line, by design.
      - path: (^|/)replay/[^/]+/consumer/main\.go$
        text: os\.Exit
        linters:
          - forbidigo
      - path: (^|/)replay/[^/]+/consumer/main\.go$
        text: G703
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/itillema/0cular

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
